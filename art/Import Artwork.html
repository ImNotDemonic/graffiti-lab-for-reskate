<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import artwork · Graffiti Lab</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#17181a;color:#eceae6}main{max-width:64rem;margin:6vh auto;padding:1.5rem}h1{margin:.2rem 0}button,input{font:inherit}button{background:#ff642d;color:#151515;font-weight:bold;border:0;padding:.65rem 1rem;cursor:pointer}button:disabled{opacity:.45}canvas{display:block;width:100%;height:15rem;object-fit:contain;background:repeating-conic-gradient(#292a2c 0 25%,#323336 0 50%) 0/18px 18px;image-rendering:pixelated;margin:1rem 0}#status{min-height:1.5em}label{display:block;margin:1.2rem 0}

fieldset{border:1px solid #474749;margin:1rem 0}fieldset label{display:inline-block;margin:.4rem .7rem .4rem 0}input[type=number]{width:4.5rem}select{font:inherit}.previews{display:grid;grid-template-columns:1fr 1fr;gap:1rem}figure{margin:0}canvas.light{background:#eee}canvas.dark{background:#171717}#handles{width:192px;height:192px;touch-action:none}canvas[hidden]{display:none}button:focus-visible{outline:3px solid white}button{margin:.2rem}#settings output{font-variant-numeric:tabular-nums}
</style>
<main><h1>Prepare artwork</h1>
<label>Original image, captured photo or existing artwork <input id="file" type="file" accept="image/png,image/jpeg,image/webp,.graffiti"></label>
<details><summary>Type lettering with system fonts</summary>
<label>Text <textarea id="lettering-text" dir="auto" rows="3" cols="40" maxlength="512"></textarea></label>
<label>Font <select id="lettering-font"><option value="sans-serif">Bold sans</option><option value="serif">Serif</option><option value="cursive">Script</option><option value="monospace">Monospace</option></select></label>
<label>Ink <input id="lettering-ink" type="color" value="#ff642d"></label>
<button id="make-lettering" type="button">Preview lettering as artwork</button>
</details>
<div class="previews"><figure><figcaption>Original</figcaption><canvas id="before"></canvas></figure><figure><figcaption>Wall preview</figcaption><canvas id="preview"></canvas></figure></div>
<label>Preview background <select id="backdrop"><option value="">Checkerboard</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<form id="settings"><fieldset><legend>Crop and rotate</legend><label>Left % <input type="number" name="left" min="0" max="99" value="0" data-action="artwork crop"></label><label>Right % <input type="number" name="right" min="0" max="99" value="0" data-action="artwork crop"></label><label>Top % <input type="number" name="top" min="0" max="99" value="0" data-action="artwork crop"></label><label>Bottom % <input type="number" name="bottom" min="0" max="99" value="0" data-action="artwork crop"></label><label>Rotation <select name="rotate"><option>0</option><option>90</option><option>180</option><option>270</option></select>°</label></fieldset>
<fieldset><legend>Transparency</legend><label><input name="border" type="checkbox"> Remove connected outer border</label>
<label>Border colour <input type="color" name="colour" value="#ffffff"></label>
<label>Tolerance <input type="range" min="0" max="160" value="18" name="tolerance"></label>
<label><input type="checkbox" name="trim"> Trim transparent margins</label></fieldset>
<fieldset><legend>Photo treatment</legend><label>Style <select name="style"><option>Original</option><option>Poster</option><option>Stencil</option><option>Comic</option><option>Halftone</option></select></label>
<label>Contrast % <input type="number" name="contrast" min="25" max="250" value="100"></label>
<label>Colour levels <input type="number" name="colours" min="2" max="12" value="4"></label>
<label>Stencil threshold <input name="threshold" type="range" min="0" max="255" value="128"></label>
<label>Comic edge strength <input name="edge" type="range" min="0" max="195" value="125"></label>
<label>Halftone pitch <input name="pitch" type="number" min="2" max="32" value="8"></label></fieldset>
<fieldset><legend>Reshape artwork</legend><label>Shape <select name="warp"><option>None</option><option>Arch</option><option>Bulge</option><option>Corners</option><option>Baseline</option><option>Perspective</option></select></label>
<label>Strength <input type="range" name="strength" min="-100" max="100" value="50"></label>
<canvas id="handles" aria-label="Drag the four corner handles" width="192" height="192" hidden></canvas></fieldset></form>
<button id="undo" disabled>Undo edit</button><button id="redo" disabled>Redo edit</button><button id="reset">Reset to original</button><button id="cancel">Cancel</button>
<label>Artwork name <input id="title" maxlength="64"></label><button id="save" disabled>Save prepared artwork…</button><p id="status" role="status"></p>
<details><summary>Build a collection</summary><label>Choose up to 12 finished .graffiti files <input id="collection-files" type="file" accept=".graffiti" multiple></label><button id="bundle">Export collection</button></details>
<p>Save the .graffiti file in the imports folder. Return to <b>Premade Art → My imports → Refresh</b> to place it. The original file stays available for another edit.</p></main>
<script>
"use strict";
// The plugin inserts the installed wall ink palette before opening this local helper.
const palette = __WALL_INKS__;
const rgb = palette.map(hex => [1,3,5].map(i => parseInt(hex.slice(i,i+2),16)));
function quantise(pixels) {
  const result = new Uint8Array(pixels.length/4);
  for (let i=0; i<result.length; ++i) {
    const p=i*4;
    if (pixels[p+3]<96) continue;
    let best=Infinity;
    for (let c=0; c<rgb.length; ++c) {
      const [r,g,b]=rgb[c];
      const distance=2*(r-pixels[p])**2+4*(g-pixels[p+1])**2+(b-pixels[p+2])**2;
      if (distance<best) { best=distance; result[i]=c+1; }
    }
  }
  return result;
}
function rectangles(grid,w,h) {
  const parts=[];
  let previous=new Map();
  for (let y=0; y<h; ++y) {
    const current=new Map();
    for (let x=0; x<w;) {
      const left=x, colour=grid[y*w+x++];
      while (x<w && grid[y*w+x]===colour) ++x;
      if (!colour) continue;
      const key=[left,x,colour].join(',');
      let part=previous.get(key);
      if (part) ++part[3];
      else { part=[left,y,x-left,1,colour]; parts.push(part); }
      current.set(key,part);
    }
    previous=current;
  }
  return parts;
}

__PREPARE_JS__
__PREPARE_UI_JS__
</script></html>
